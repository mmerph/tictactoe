</head>

            <button onclick="location.href='index.html'">

        </h1>
    </div>



    <!-- TABLERO + CONTROLES -->
    <div class="tablero-con-controles">

        <!-- Tablero 3x3. El canvas de la línea ganadora se posiciona encima -->
        <div class="contenedor-tablero">
            <table id="tablero">
                <tr>
                    <td onclick="Chturn(this)"></td>
                    <td onclick="Chturn(this)"></td>
                    <td onclick="Chturn(this)"></td>
                </tr>
                <tr>
                    <td onclick="Chturn(this)"></td>
                    <td onclick="Chturn(this)"></td>
                    <td onclick="Chturn(this)"></td>
                </tr>
                <tr>
                    <td onclick="Chturn(this)"></td>
                    <td onclick="Chturn(this)"></td>
                    <td onclick="Chturn(this)"></td>
                </tr>
            </table>
            <canvas id="lineaGanadora"></canvas>
        </div>

        <!-- Panel lateral de controles -->
        <div class="controles">

            <!-- Indicador de turno. JS actualiza #fichaActual con el SVG de la pieza -->
            <div id="turno" class="turno-display line-seed-jp-bold">
                Turno: <span id="fichaActual" class="ficha-turno"></span>
            </div>

            <!-- Temporizador -->
            <div id="temporizador" class="kumar-one-regular">03:00</div>

            <!-- Botón reiniciar -->
            <button onclick="location.reload()">
                <svg class="iconoBoton" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <path fill="currentColor"
                        d="M244,56v48a12,12,0,0,1-12,12H184a12,12,0,1,1,0-24H201.1l-19-17.38c-.13-.12-.26-.24-.38-.37A76,76,0,1,0,127,204h1a75.53,75.53,0,0,0,52.15-20.72,12,12,0,0,1,16.49,17.45A99.45,99.45,0,0,1,128,228h-1.37A100,100,0,1,1,198.51,57.06L220,76.72V56a12,12,0,0,1,24,0Z">
                    </path>
                </svg>
                &nbsp;Reiniciar
            </button>

            <div class="selectores">

                <div class="selector-piezas">
                    <p class="line-seed-jp-bold">Fichas:</p>

                <!-- Color de celdas (dos pickers) -->
                <div class="selector-color">
                    Colores de celda:
                    <br><br>
                    <input type="color" id="color1" value="#F288B9"
                        oninput="document.documentElement.style.setProperty('--color-celda1', this.value)">
                    <input type="color" id="color2" value="#AAF277"
                        oninput="document.documentElement.style.setProperty('--color-celda2', this.value)">
                </div>

                <!-- Color de la línea ganadora -->
                <div class="selector-color">
                    Color línea ganadora:
                    <br><br>
                    <input type="color" id="colorLinea" value="#882164">
                </div>
            </div>

    </div>

    <!-- DIÁLOGO DE FIN DE JUEGO — oculto por defecto, JS lo muestra al terminar -->
    <div id="dialogoVictoria" class="dialogo-victoria-oculto">
        <div class="dialogo-victoria-contenido">

            <!-- ÍCONO DEL DIÁLOGO: pega tu <path fill="currentColor" d="..."> aquí -->
            <svg class="iconoH1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true">
                <path fill="currentColor"
                    d="M229.7,82.84l-175.94-54-.16-.05A20,20,0,0,0,28,48V192a20,20,0,0,0,19.94,20,20.38,20.38,0,0,0,5.66-.81l.16,0,78.24-24V196a20,20,0,0,0,20,20h32a20,20,0,0,0,20-20V165.06l25.7-7.89A20.1,20.1,0,0,0,244,138V102A20.1,20.1,0,0,0,229.7,82.84ZM52,186.58V53.43L132,78V162ZM180,192H156V179.78l24-7.36Zm40-56.95-64,19.63V85.33L220,105Z" />
            </svg>

            <!-- JS cambia este texto: "¡Gana ✿!", "EMPATE", "⏱ Tiempo agotado" -->
            <h2 class="kumar-one-regular" id="mensajeVictoria"></h2>

            <!-- JS inserta aquí el SVG de la ficha ganadora -->
            <div id="fichaGanadora" class="ficha-dialogo"></div>

            <button class="btn-cerrar-dialogo" onclick="cerrarDialogo()">
                <!-- ÍCONO CERRAR: pega tu <path fill="currentColor" d="..."> aquí -->
                <svg class="iconoBoton" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <path fill="currentColor" d="M168.49,104.49,145,128l23.52,23.51a12,12,0,0,1-17,17L128,145l-23.51,23.52a12,12,0,0,1-17-17L111,128,87.51,104.49a12,12,0,0,1,17-17L128,111l23.51-23.52a12,12,0,0,1,17,17ZM236,128A108,108,0,1,1,128,20,108.12,108.12,0,0,1,236,128Zm-24,0a84,84,0,1,0-84,84A84.09,84.09,0,0,0,212,128Z" />

                Cerrar

        </div>
    </div>
